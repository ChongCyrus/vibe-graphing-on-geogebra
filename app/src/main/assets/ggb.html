<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GeoGebra Classic 5</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
    }
    #ggbApplet {
        width: 100%;
        height: 100%;
        display: block;
    }

    /*
     * Android phone layout fix.
     *
     * GeoGebra's mobile toolbar puts undo/redo/search/menu (rightButtonPanel)
     * and the drawing toolbar (toolBPanel) into the same 53px row. We remove
     * rightButtonPanel from the flow and pin it above the bottom-right zoom
     * panel, keeping only the original undo/redo arrow icons visible. The
     * drawing toolbar then gets the whole 53px row. The search/menu buttons
     * remain in the DOM (hidden) and are triggered from the native Android
     * top bar, so no functionality is lost.
     */
    .GeoGebraFrame .toolbarPanel .rightButtonPanel,
    .GeoGebraFrame .toolbarPanel .rightButtonPanelMobile {
        position: fixed !important;
        top: auto !important;
        left: auto !important;
        right: 16px !important;
        bottom: 220px; /* fallback; JS aligns it above the zoom panel */
        width: auto !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        z-index: 80;
    }

    /* Keep only the original undo/redo arrow buttons visible. */
    .GeoGebraFrame .toolbarPanel .rightButtonPanel > *:nth-child(n+3) {
        display: none !important;
    }

    .GeoGebraFrame .toolbarPanel .toolBPanel,
    .GeoGebraFrame .toolbarPanel .toolBPanelMobile {
        float: none !important;
        clear: both;
        width: 100% !important;
    }

    /*
     * Anti-mis-touch: the drawing canvas must not be subject to browser
     * touch scrolling/pinch gestures, so GeoGebra receives a clean
     * pointerdown -> pointermove -> pointerup stream for drawing tools.
     */
    .GeoGebraFrame canvas,
    .GeoGebraFrame .gwt-Canvas {
        touch-action: none;
    }

    /* Keep the search view title ("打开") on one horizontal line. */
    .GeoGebraFrame .headerView .headerCaption {
        white-space: nowrap !important;
        flex-shrink: 0;
    }
</style>
</head>
<body>
<div id="ggbApplet"></div>
<script src="deployggb.js"></script>
<script src="svg2tikz.js"></script>
<script>
(function () {
    "use strict";

    var appletId = "ggbApplet";
    var api = null;

    // ---------- query string helpers ----------
    var qs = {};
    (function () {
        var query = location.search || "";
        query.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) {
            qs[decodeURIComponent(k)] = decodeURIComponent(v);
            return _;
        });
    })();

    function qBool(name, def) {
        var v = qs[name];
        if (v === undefined || v === "") return def;
        return v === "true" || v === "1" || v === "yes";
    }

    function qNum(name, def) {
        var n = parseFloat(qs[name]);
        return isNaN(n) ? def : n;
    }

    function qStr(name, def) {
        var v = qs[name];
        return (v === undefined || v === "") ? def : v;
    }

    function notifyReady() {
        try { AndroidBridge.onAppletReady(); } catch (e) { /* bridge not ready yet */ }
    }

    function notifyError(msg) {
        try { AndroidBridge.onAppletError(msg || "unknown error"); } catch (e) { /* ignore */ }
    }

    function ggbOnLoad(loadedApi) {
        api = loadedApi;
        window.ggbApi = api;
        notifyReady();
    }
    window.ggbOnLoad = ggbOnLoad;

    // ---------- GeoGebra Classic 5 applet parameters ----------
    var params = {
        id: appletId,
        showMenuBar: qBool("showMenuBar", true),
        showToolBar: qBool("showToolBar", true),
        showAlgebraInput: qBool("showAlgebraInput", true),
        showToolBarHelp: qBool("showToolBarHelp", false),
        showResetIcon: qBool("showResetIcon", false),
        enableLabelDrags: qBool("enableLabelDrags", true),
        enableShiftDragZoom: qBool("enableShiftDragZoom", true),
        enableRightClick: qBool("enableRightClick", true),
        showZoomButtons: qBool("showZoomButtons", true),
        showFullscreenButton: qBool("showFullscreenButton", false),
        scale: qNum("scale", 1),
        disableAutoScale: qBool("disableAutoScale", false),
        clickToLoad: qBool("clickToLoad", false),
        language: qStr("language", "zh-CN"),
        prerelease: false,
        appName: "classic",
        allowUpscale: true,
        appletOnLoad: ggbOnLoad
    };

    // width/height: if provided use them, otherwise let deployggb size to the container.
    if (qs.width !== undefined && qs.width !== "") {
        params.width = Math.max(1, parseInt(qs.width, 10) || 0);
    }
    if (qs.height !== undefined && qs.height !== "") {
        params.height = Math.max(1, parseInt(qs.height, 10) || 0);
    }

    // Classic 5 views: algebra + graphics.
    var views = {
        is3D: 0,
        AV: 1,
        SV: 0,
        CV: 0,
        EV2: 0,
        CP: 0,
        PC: 0,
        DA: 0,
        FI: 0,
        macro: 0
    };

    var codebase = location.href.split("?")[0];
    codebase = codebase.slice(0, codebase.lastIndexOf("/") + 1) + "web3d/";

    try {
        var applet = new GGBApplet(params, "5.0", views);
        applet.setHTML5Codebase(codebase);
        applet.inject(appletId);
    } catch (e) {
        notifyError(e.message);
    }

    // ---------- position original undo/redo above the bottom-right zoom panel ----------
    function positionUndoRedoDock() {
        var rbp = document.querySelector(".rightButtonPanel");
        var zp = document.querySelector(".zoomPanel");
        if (!rbp || !zp) return;
        var rect = zp.getBoundingClientRect();
        var bottom = Math.max(8, window.innerHeight - rect.top + 8);
        rbp.style.bottom = bottom + "px";
        rbp.style.right = "16px";
    }

    function installUndoRedoDockPositioning() {
        var timer = null;

        function schedule() {
            if (timer) return;
            timer = setTimeout(function () {
                timer = null;
                positionUndoRedoDock();
            }, 100);
        }

        positionUndoRedoDock();
        window.addEventListener("resize", schedule);
        if (window.MutationObserver) {
            var mo = new MutationObserver(schedule);
            mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        } else {
            setInterval(positionUndoRedoDock, 1000);
        }
    }

    installUndoRedoDockPositioning();

    // ---------- anti-mis-touch: toolbar horizontal touch scrolling ----------
    // GeoGebra's mobile toolbar treats every touchend on a tool button as a
    // click (it compares toolbar.getAbsoluteLeft() with itself). We add a real
    // touch-drag threshold: a horizontal finger move scrolls toolBPanel and
    // suppresses the tool activation; taps without movement still work.
    function installToolbarTouchScroll() {
        var startX = null;
        var startY = null;
        var startScrollLeft = 0;
        var moved = false;
        var activePanel = null;
        var suppressClickUntil = 0;

        function panelFor(target) {
            if (!target || !target.closest) return null;
            return target.closest(".toolbarPanel .toolBPanel");
        }

        document.addEventListener("touchstart", function (e) {
            var panel = panelFor(e.target);
            if (!panel) {
                activePanel = null;
                return;
            }
            var t = e.touches && e.touches[0];
            if (!t) return;
            startX = t.clientX;
            startY = t.clientY;
            startScrollLeft = panel.scrollLeft;
            moved = false;
            activePanel = panel;
        }, { capture: true, passive: true });

        document.addEventListener("touchmove", function (e) {
            if (!activePanel) return;
            var t = e.touches && e.touches[0];
            if (!t) return;
            var dx = t.clientX - startX;
            var dy = t.clientY - startY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
                moved = true;
                activePanel.scrollLeft = startScrollLeft - dx;
                if (e.cancelable) e.preventDefault();
            } else if (Math.abs(dy) > 6) {
                moved = true; // vertical swipe on the toolbar: never a click
            }
        }, { capture: true, passive: false });

        document.addEventListener("touchend", function (e) {
            if (activePanel && moved) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                suppressClickUntil = Date.now() + 500;
            }
            activePanel = null;
            moved = false;
        }, { capture: true, passive: false });

        // Chrome fires a synthetic click after touchend; keep it away from the
        // toolbar buttons when the touch ended in a drag.
        document.addEventListener("click", function (e) {
            if (Date.now() < suppressClickUntil && panelFor(e.target)) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
        }, true);
    }

    installToolbarTouchScroll();

    // ---------- drawing area tap/drag/pinch guard ----------
    // GeoGebra executes the first step of a drawing tool on pointerdown.
    // For tap-only tools we suppress the first pointerdown and then:
    //   * release without movement -> re-dispatch a synthetic tap
    //   * movement beyond threshold -> forward the original pointerdown so
    //     GeoGebra can perform its normal drag/creation gesture
    //   * second finger -> temporarily switch to Move mode, forward the first
    //     pointerdown and let the pinch go through natively; restore the
    //     drawing tool when the pinch ends
    function currentMode() {
        if (window.ggbApi && typeof window.ggbApi.getMode === "function") {
            try {
                var m = window.ggbApi.getMode();
                if (typeof m === "number" && !isNaN(m)) return m;
            } catch (e) {}
        }
        var btn = document.querySelector(".toolbarPanel .toolbar_button[isSelected=\"true\"]");
        if (!btn) return -1;
        var mode = parseInt(btn.getAttribute("mode"), 10);
        return isNaN(mode) ? -1 : mode;
    }

    function isTapOnlyMode(mode) {
        if (mode < 0) return false;
        // 0 = Move, 40 = TranslateView, 41 = ZoomIn, 42 = ZoomOut,
        // 62 = Pen, 73 = Freehand Shape
        var excluded = [0, 40, 41, 42, 62, 73];
        return excluded.indexOf(mode) === -1;
    }

    function createSyntheticPointerEvent(type, target, clientX, clientY, pointerId) {
        var rect = target.getBoundingClientRect();
        var ev;
        if (typeof PointerEvent === "function") {
            ev = new PointerEvent(type, {
                bubbles: true,
                cancelable: true,
                composed: true,
                pointerId: pointerId,
                pointerType: "touch",
                isPrimary: true,
                clientX: clientX,
                clientY: clientY,
                button: 0,
                buttons: type === "pointerdown" ? 1 : 0,
                width: 1,
                height: 1,
                pressure: 0.5
            });
            try {
                Object.defineProperty(ev, "offsetX", {
                    get: function () { return clientX - rect.left; }
                });
                Object.defineProperty(ev, "offsetY", {
                    get: function () { return clientY - rect.top; }
                });
            } catch (e) {
                // keep the browser defaults
            }
        } else {
            ev = document.createEvent("MouseEvents");
            ev.initMouseEvent(type, true, true, window, 0,
                    clientX, clientY, clientX, clientY,
                    false, false, false, false, 0, null);
        }
        return ev;
    }

    function firePointerTap(target, clientX, clientY) {
        target.dispatchEvent(createSyntheticPointerEvent("pointerdown", target, clientX, clientY, 1));
        target.dispatchEvent(createSyntheticPointerEvent("pointerup", target, clientX, clientY, 1));
    }

    function installDrawingTapGuard() {
        var activePointers = {};
        var syntheticTap = false;
        var pinch = null;

        function isCanvasEvent(e) {
            var t = e.target;
            return !!(t && t.nodeType === 1 && t.closest && t.closest("canvas"));
        }

        function setModeSafely(mode) {
            try {
                if (window.ggbApi && typeof window.ggbApi.setMode === "function") {
                    window.ggbApi.setMode(mode);
                }
            } catch (err) {
                // ignore
            }
        }

        function restorePinchMode() {
            if (pinch) {
                setModeSafely(pinch.prevMode);
                pinch = null;
            }
        }

        function forwardPointerDown(p, pointerId) {
            if (p.forwarded) return;
            p.forwarded = true;
            var ev = createSyntheticPointerEvent("pointerdown", p.target, p.x, p.y, pointerId);
            ev.__ggbSyntheticTap = true;
            p.target.dispatchEvent(ev);
        }

        document.addEventListener("pointerdown", function (e) {
            if (syntheticTap || e.__ggbSyntheticTap) return;
            if (e.pointerType === "mouse") return;
            if (!isCanvasEvent(e)) return;
            var mode = currentMode();
            if (!isTapOnlyMode(mode)) return;

            var ids = Object.keys(activePointers);

            // Second finger: start a pinch in Move mode so the drawing tool's
            // first step is not executed; forward the first finger's down so
            // GeoGebra sees two pointers and zooms natively.
            if (ids.length >= 1 && !pinch) {
                pinch = { prevMode: mode };
                setModeSafely(0);

                var firstId = ids[0];
                var first = activePointers[firstId];
                forwardPointerDown(first, firstId);
                first.moved = true;

                activePointers[e.pointerId] = {
                    x: e.clientX,
                    y: e.clientY,
                    time: Date.now(),
                    target: e.target,
                    moved: true,
                    forwarded: true
                };
                // Let this second pointerdown continue to GeoGebra.
                return;
            }

            if (ids.length >= 1) {
                // Extra fingers during pinch: suppress.
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
                return;
            }

            // First finger: suppress for now.
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            activePointers[e.pointerId] = {
                x: e.clientX,
                y: e.clientY,
                time: Date.now(),
                target: e.target,
                moved: false,
                forwarded: false
            };
        }, true);

        document.addEventListener("pointermove", function (e) {
            var p = activePointers[e.pointerId];
            if (!p) return;
            if (p.forwarded) return; // already forwarded: let native move through

            var dx = e.clientX - p.x;
            var dy = e.clientY - p.y;
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                p.moved = true;
                // Forward the original pointerdown so GeoGebra starts the drag
                // at the original position, then let this move through too.
                forwardPointerDown(p, e.pointerId);
                return;
            }

            e.stopPropagation();
        }, true);

        function finishPointer(e, cancelled) {
            var p = activePointers[e.pointerId];
            if (!p) return;
            delete activePointers[e.pointerId];

            if (!p.forwarded) {
                // The original pointerdown was suppressed, so the matching
                // pointerup must not reach GeoGebra either.
                e.stopPropagation();

                if (!cancelled && !p.moved && Date.now() - p.time <= 800
                        && Object.keys(activePointers).length === 0) {
                    syntheticTap = true;
                    try {
                        firePointerTap(p.target, p.x, p.y);
                    } finally {
                        syntheticTap = false;
                    }
                }
            }

            if (pinch && Object.keys(activePointers).length === 0) {
                restorePinchMode();
            }
        }

        document.addEventListener("pointerup", function (e) {
            finishPointer(e, false);
        }, true);

        document.addEventListener("pointercancel", function (e) {
            finishPointer(e, true);
        }, true);
    }

    installDrawingTapGuard();

    // ---------- native IME for search field and algebra input ----------
    var lastSearchQuery = "";
    var returnToSearchAfterMaterial = false;

    function currentSearchInput() {
        return document.querySelector(".searchBar input, .searchBar textarea");
    }

    function allNativeEditableInputs() {
        return document.querySelectorAll(
                ".searchBar input, .searchBar textarea,"
                + " .AlgebraInput .AutoCompleteTextFieldW input,"
                + " .AlgebraInput .AutoCompleteTextFieldW textarea");
    }

    function isNativeEditableTarget(target) {
        if (!target || !target.closest) return false;
        return !!(target.closest(".searchBar")
                || target.closest(".AlgebraInput .AutoCompleteTextFieldW"));
    }

    function makeNativeInputsEditable() {
        var inputs = allNativeEditableInputs();
        for (var i = 0; i < inputs.length; i++) {
            var input = inputs[i];
            try {
                input.readOnly = false;
                input.removeAttribute("readonly");
            } catch (err) {
                // ignore
            }
            var wrapper = input.closest(".searchInputField")
                    || input.closest(".AutoCompleteTextFieldW")
                    || input.parentElement;
            if (wrapper) {
                wrapper.classList.remove("withCursorOverlay");
            }
        }
    }

    function makeSearchInputEditable() {
        makeNativeInputsEditable();
    }

    // GeoGebra creates these fields as readonly native inputs and shows its
    // own keyboard. Make the native input editable again before focus.
    document.addEventListener("touchstart", function (event) {
        var target = event.target;
        if (isNativeEditableTarget(target)) {
            makeNativeInputsEditable();
            // Do not let GeoGebra's own touchstart handler prevent native focus.
            event.stopPropagation();
        }
    }, { capture: true, passive: false });

    document.addEventListener("pointerdown", function (event) {
        var target = event.target;
        if (isNativeEditableTarget(target)) {
            makeNativeInputsEditable();
        }
    }, true);

    document.addEventListener("focus", function (event) {
        var target = event.target;
        if (isNativeEditableTarget(target)) {
            makeNativeInputsEditable();
            // Stop GWT's own focus handler (which would open GeoGebra's
            // on-screen keyboard). The input is still focused natively, so
            // Android shows the default IME.
            event.stopPropagation();
        }
    }, true);

    document.addEventListener("keypress", function (e) {
        if (e.key === "Enter" || e.keyCode === 13) {
            var target = e.target;
            if (target && target.closest && target.closest(".searchBar")) {
                lastSearchQuery = target.value || "";
            }
        }
    }, true);

    // Record "open material from search" for the in-app back button. This also
    // covers the three-dot context menu items ("编辑"/"查看") that are not
    // inside .materialCard.
    document.addEventListener("click", function (e) {
        var target = e.target;
        if (!target || !target.closest) return;

        var materialCardClick = target.closest(".materialCard");
        var menuItem = target.closest("[role=\"menuitem\"], .gwt-MenuItem, .menuItem, li");
        var menuText = menuItem ? (menuItem.textContent || "").trim() : "";
        var isOpenAction = menuText === "查看" || menuText === "编辑"
                || menuText === "View" || menuText === "Edit";

        if (materialCardClick || isOpenAction) {
            var input = currentSearchInput();
            if (input) {
                lastSearchQuery = input.value || lastSearchQuery;
            }
            if (document.querySelector(".openFileView")) {
                returnToSearchAfterMaterial = true;
            }
        }
    }, true);

    function fillSearchAndRun() {
        var input = currentSearchInput();
        if (!input) return false;
        input.value = lastSearchQuery;
        try {
            var ev = new KeyboardEvent("keypress", {
                key: "Enter", code: "Enter", keyCode: 13,
                which: 13, charCode: 13, bubbles: true
            });
            input.dispatchEvent(ev);
        } catch (err) {
            // best effort: the query is already filled in
        }
        return true;
    }

    window.__ggbBack = function () {
        var openView = document.querySelector(".openFileView");
        if (openView) {
            var back = openView.querySelector(".headerBackButton");
            if (back) {
                back.click();
            }
            returnToSearchAfterMaterial = false;
            return true;
        }

        // Opened a material from search results: go back to the search view.
        if (returnToSearchAfterMaterial) {
            returnToSearchAfterMaterial = false;
            var reopened = window.__ggbClickRightButton
                    && window.__ggbClickRightButton("search");
            if (reopened && lastSearchQuery) {
                var attempts = 0;
                var timer = setInterval(function () {
                    if (fillSearchAndRun()) {
                        clearInterval(timer);
                    } else if (++attempts > 40) {
                        clearInterval(timer);
                    }
                }, 100);
            }
            return true;
        }

        // Main drawing page: nothing to go back to; do nothing.
        return true;
    };

    // ---------- LaTeX -> GeoGebra command translation ----------
    function latexToGgb(latex) {
        var s = String(latex || "");
        s = s.replace(/\\left/g, "").replace(/\\right/g, "");
        s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "(($1)/($2))");
        s = s.replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g, "(($1)/($2))");
        s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, "sqrt($1)");
        s = s.replace(/\\sqrt/g, "sqrt");
        s = s.replace(/\\cdot/g, "*").replace(/\\times/g, "*").replace(/\\div/g, "/");
        s = s.replace(/\\le/g, "<=").replace(/\\ge/g, ">=").replace(/\\ne/g, "!=");
        s = s.replace(/\\leq/g, "<=").replace(/\\geq/g, ">=").replace(/\\neq/g, "!=");
        s = s.replace(/\\infty/g, "infinity");
        s = s.replace(/\\pm/g, "±").replace(/\\mp/g, "∓");

        var greek = {
            alpha: "alpha", beta: "beta", gamma: "gamma", delta: "delta",
            epsilon: "epsilon", zeta: "zeta", eta: "eta", theta: "theta",
            iota: "iota", kappa: "kappa", lambda: "lambda", mu: "mu",
            nu: "nu", xi: "xi", pi: "pi", rho: "rho", sigma: "sigma",
            tau: "tau", upsilon: "upsilon", phi: "phi", chi: "chi",
            psi: "psi", omega: "omega"
        };
        for (var name in greek) {
            if (greek.hasOwnProperty(name)) {
                var re = new RegExp("\\\\" + name + "(?![a-zA-Z])", "g");
                s = s.replace(re, greek[name]);
            }
        }

        s = s.replace(/\\(sin|cos|tan|cot|sec|csc|arcsin|arccos|arctan|sinh|cosh|tanh|ln|log|exp|abs|floor|ceil|min|max)(?![a-zA-Z])/g, "$1");
        s = s.replace(/\\([a-zA-Z]+)/g, "$1");
        s = s.replace(/\{/g, "(").replace(/\}/g, ")");
        return s;
    }

    window.__ggbEvalLaTeX = function (latex) {
        if (!api || typeof api.evalCommand !== "function") return false;
        var cmd = latexToGgb(latex);
        if (!cmd.trim()) return false;
        try {
            return api.evalCommand(cmd);
        } catch (e) {
            return false;
        }
    };

    window.__ggbRunGgbScript = function (script) {
        if (!api || typeof api.evalCommand !== "function") return false;
        var lines = String(script || "").split(/\r?\n/);
        var executed = 0;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            try {
                api.evalCommand(line);
                executed++;
            } catch (e) {
                // continue with the next command
            }
        }
        return executed > 0;
    };

    // Execute GGB commands and return a JSON log line-by-line.
    window.__ggbRunGgbScriptWithLog = function (script) {
        if (!api || typeof api.evalCommand !== "function") {
            return JSON.stringify({ ok: false, error: "GeoGebra API is not ready", lines: [] });
        }
        var lines = String(script || "").split(/\r?\n/);
        var out = [];
        var executed = 0;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            try {
                api.evalCommand(line);
                executed++;
                out.push({ line: line, ok: true, error: "" });
            } catch (e) {
                out.push({ line: line, ok: false, error: e.message || String(e) });
            }
        }
        return JSON.stringify({ ok: executed > 0, executed: executed, lines: out });
    };

    // Execute arbitrary JavaScript inside the GeoGebra page context.
    window.__ggbRunJsScript = function (script) {
        try {
            var result = eval(String(script || ""));
            try {
                return JSON.stringify(result);
            } catch (jsonErr) {
                return String(result);
            }
        } catch (e) {
            return "ERROR: " + (e.message || String(e));
        }
    };

    // Snapshot of the current construction for the LLM feedback loop.
    // Includes ALL objects with their full visible state (colour, filling,
    // line/point style, label, layer, fixed/trace flags, definition, value,
    // coordinates) plus the graphics view state (axes/grid/background/range).
    window.__ggbGetSnapshot = function () {
        var snap = { objectNumber: 0, objects: [], view: {}, mode: -1, error: "" };
        if (!api) {
            snap.error = "GeoGebra API is not ready";
            return JSON.stringify(snap);
        }

        function safeGet(fn) {
            try {
                var v = fn();
                return (v === undefined) ? null : v;
            } catch (e) {
                return null;
            }
        }

        try { snap.mode = safeGet(function () { return api.getMode(); }); } catch (e) {}

        try {
            if (typeof api.getObjectNumber === "function") {
                snap.objectNumber = api.getObjectNumber();
            }
            if (typeof api.getAllObjectNames === "function") {
                var names = api.getAllObjectNames();
                snap.truncated = false;
                for (var i = 0; i < names.length; i++) {
                    var name = names[i];
                    var o = { name: name };
                    o.type = safeGet(function () { return api.getObjectType(name); });
                    o.defined = safeGet(function () { return api.isDefined(name); });
                    o.independent = safeGet(function () { return api.isIndependent(name); });
                    o.visible = safeGet(function () { return api.getVisible(name); });
                    o.labelVisible = safeGet(function () { return api.getLabelVisible(name); });
                    o.fixed = safeGet(function () { return api.isFixed(name); });
                    o.trace = safeGet(function () { return api.isTracing(name); });
                    o.layer = safeGet(function () { return api.getLayer(name); });
                    o.color = safeGet(function () { return api.getColor(name); });
                    o.filling = safeGet(function () { return api.getFilling(name); });
                    o.lineThickness = safeGet(function () { return api.getLineThickness(name); });
                    o.lineStyle = safeGet(function () { return api.getLineStyle(name); });
                    o.pointSize = safeGet(function () { return api.getPointSize(name); });
                    o.pointStyle = safeGet(function () { return api.getPointStyle(name); });
                    o.value = safeGet(function () { return api.getValueString(name); });
                    o.definition = safeGet(function () { return api.getDefinitionString(name); });
                    o.command = safeGet(function () { return api.getCommandString(name); });
                    o.caption = safeGet(function () { return api.getCaption(name); });
                    if (o.type === "point" || o.type === "vector") {
                        o.x = safeGet(function () { return api.getXcoord(name); });
                        o.y = safeGet(function () { return api.getYcoord(name); });
                    }
                    snap.objects.push(o);
                }
            }
        } catch (e) {
            snap.error = (snap.error ? snap.error + "; " : "") + (e.message || String(e));
        }

        try {
            if (typeof api.getViewProperties === "function") {
                var vpRaw = api.getViewProperties(1);
                try {
                    snap.view.properties = JSON.parse(vpRaw);
                } catch (e) {
                    snap.view.properties = vpRaw;
                }
            }
            if (typeof api.getGraphicsOptions === "function") {
                var go = api.getGraphicsOptions(1);
                try {
                    snap.view.graphics = JSON.parse(JSON.stringify(go));
                } catch (e) {
                    snap.view.graphics = null;
                }
            }
            if (typeof api.getGridVisible === "function") {
                snap.view.gridVisible = api.getGridVisible(1);
            }
        } catch (e) {
            // view properties are best-effort
        }

        return JSON.stringify(snap);
    };

    // ---------- object management helpers ----------
    window.__ggbListObjects = function () {
        var out = [];
        if (!api) return JSON.stringify(out);
        try {
            var names = (typeof api.getAllObjectNames === "function")
                    ? api.getAllObjectNames() : [];
            for (var i = 0; i < names.length; i++) {
                var name = names[i];
                var type = "";
                try {
                    type = (typeof api.getObjectType === "function")
                            ? api.getObjectType(name) : "";
                } catch (e2) {}
                out.push({ name: name, type: type });
            }
        } catch (e) {}
        return JSON.stringify(out);
    };

    // Delete every construction object while keeping axes/grid/view settings.
    window.__ggbClearAll = function () {
        if (!api) return false;
        try {
            if (typeof api.setUndoPoint === "function") {
                api.setUndoPoint();
            }
            var names = (typeof api.getAllObjectNames === "function")
                    ? api.getAllObjectNames() : [];
            for (var i = 0; i < names.length; i++) {
                try {
                    if (typeof api.deleteObject === "function") {
                        api.deleteObject(names[i]);
                    }
                } catch (e) {}
            }
            return true;
        } catch (e) {
            return false;
        }
    };

    window.__ggbSetMode = function (mode) {
        if (!api || typeof api.setMode !== "function") return false;
        try {
            api.setMode(mode);
            return true;
        } catch (e) {
            return false;
        }
    };

    // Silence GeoGebra's native error dialogs while the LLM agent executes
    // scripts, so failed commands only appear in the chat tool log.
    window.__ggbSetErrorDialogsActive = function (flag) {
        if (!api || typeof api.setErrorDialogsActive !== "function") return false;
        try {
            api.setErrorDialogsActive(!!flag);
            return true;
        } catch (e) {
            return false;
        }
    };

    // Dispatch a native Delete key so GeoGebra deletes whatever is currently
    // selected in the view (tap-selected or marquee-selected objects).
    window.__ggbDeleteSelected = function () {
        try {
            if (api && typeof api.setUndoPoint === "function") {
                api.setUndoPoint();
            }
            // Dispatch from inside #ggbApplet so the event bubbles through
            // whichever element GWT sank key events on (applet container or body).
            var applet = document.querySelector("#ggbApplet");
            var target = (applet && applet.firstElementChild) ? applet.firstElementChild
                    : (applet || document.body || document.documentElement);
            var ev;
            if (typeof KeyboardEvent === "function") {
                ev = new KeyboardEvent("keydown", {
                    bubbles: true,
                    cancelable: true,
                    key: "Delete",
                    code: "Delete"
                });
                try {
                    Object.defineProperty(ev, "keyCode", { get: function () { return 46; } });
                    Object.defineProperty(ev, "which", { get: function () { return 46; } });
                    Object.defineProperty(ev, "charCode", { get: function () { return 0; } });
                } catch (e2) {}
            } else {
                ev = document.createEvent("Event");
                ev.initEvent("keydown", true, true);
                try {
                    Object.defineProperty(ev, "keyCode", { get: function () { return 46; } });
                } catch (e3) {}
            }
            target.dispatchEvent(ev);
            return true;
        } catch (e) {
            return false;
        }
    };

    // ---------- helpers for Android ----------
    function b64ToUtf8(b64) {
        if (!b64) return "";
        if (b64.indexOf("data:") === 0 && b64.indexOf(",") >= 0) {
            b64 = b64.slice(b64.indexOf(",") + 1);
        }
        var binary = atob(b64);
        if (typeof TextDecoder === "undefined") {
            return decodeURIComponent(escape(binary));
        }
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder("utf-8").decode(bytes);
    }

    function ok(cbId, payload) {
        try { AndroidBridge.onResult(cbId, true, payload, null); } catch (e) { /* ignore */ }
    }

    function fail(cbId, message) {
        try { AndroidBridge.onResult(cbId, false, null, message || "unknown error"); } catch (e) { /* ignore */ }
    }

    function requireApi(cbId) {
        if (!api) {
            fail(cbId, "GeoGebra applet is not ready yet");
            return false;
        }
        return true;
    }

    window.__ggbIsReady = function () {
        return !!api;
    };

    window.__ggbGetSvg = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            // The exported Classic 5 API has exportSVG(callback) where the
            // callback receives the SVG source directly (there is no
            // getSVGBase64 in this build).
            api.exportSVG(function (svgText) {
                ok(cbId, svgText || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbGetPng = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            api.getScreenshotBase64(function (b64) {
                ok(cbId, b64 || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbGetGgb = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            api.getBase64(function (b64) {
                ok(cbId, b64 || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    var ggbIncoming = {};

    window.__ggbSetGgbBegin = function (cbId) {
        ggbIncoming[cbId] = "";
    };

    window.__ggbSetGgbChunk = function (cbId, chunk) {
        if (typeof ggbIncoming[cbId] === "string") {
            ggbIncoming[cbId] += chunk;
        }
    };

    window.__ggbSetGgbEnd = function (cbId) {
        var b64 = ggbIncoming[cbId] || "";
        delete ggbIncoming[cbId];
        if (!requireApi(cbId)) return;
        try {
            api.setBase64(b64, function () {
                ok(cbId, null);
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbReset = function () {
        if (!api) return false;
        try {
            api.reset();
            return true;
        } catch (e) {
            return false;
        }
    };

    window.__ggbEvalCommand = function (cmd) {
        if (!api) return false;
        try {
            return api.evalCommand(cmd);
        } catch (e) {
            return false;
        }
    };

    window.__ggbUndo = function () {
        if (api && typeof api.undo === "function") {
            api.undo();
            return true;
        }
        return false;
    };

    window.__ggbRedo = function () {
        if (api && typeof api.redo === "function") {
            api.redo();
            return true;
        }
        return false;
    };

    // The native Android top bar owns undo/redo/search/menu. The GeoGebra
    // rightButtonPanel is moved off-screen by CSS, but its buttons are still
    // in the DOM and remain clickable programmatically.
    // Normal child order in rightButtonPanel: undo, redo, search, menu.
    window.__ggbClickRightButton = function (role) {
        if (role === "search") {
            returnToSearchAfterMaterial = false;
        }
        var rbp = document.querySelector(".rightButtonPanel");
        if (!rbp) return false;
        var kids = rbp.children;
        var idx = -1;
        if (role === "menu") {
            idx = kids.length >= 4 ? 3 : kids.length >= 3 ? 2 : -1;
        } else if (role === "search") {
            idx = kids.length >= 4 ? 2 : -1;
        }
        if (idx >= 0 && kids[idx]) {
            kids[idx].click();
            return true;
        }
        return false;
    };

    window.__ggbGetTikz = function (cbId, settingsJson) {
        if (!requireApi(cbId)) return;
        try {
            var settings = JSON.parse(settingsJson);
            var mode = settings.outputMode || "codeblock";

            function figSettings() {
                var s = {};
                for (var k in settings) {
                    if (settings.hasOwnProperty(k)) s[k] = settings[k];
                }
                s.outputMode = "figonly";
                return s;
            }

            api.exportSVG(function (svgText) {
                try {
                    if (!svgText || svgText.indexOf("<svg") === -1) {
                        fail(cbId, "GeoGebra returned no SVG content. Draw something first.");
                        return;
                    }
                    var doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
                    var svg = doc.querySelector("svg");
                    if (!svg) {
                        fail(cbId, "Could not parse the SVG exported by GeoGebra.");
                        return;
                    }

                    var out;
                    if (mode === "codeblock") {
                        var c = new SvgToTikzConverter(figSettings()).convert(svg);
                        out = "~~~tikz\n\\begin{document}\n" + c + "\n\\end{document}\n\n~~~\n";
                    } else if (mode === "standalone") {
                        var st = figSettings();
                        st.outputMode = "standalone";
                        out = new SvgToTikzConverter(st).convert(svg);
                    } else if (mode === "figonly") {
                        out = new SvgToTikzConverter(figSettings()).convert(svg);
                    } else {
                        var co = figSettings();
                        co.outputMode = "codeonly";
                        out = new SvgToTikzConverter(co).convert(svg);
                    }
                    ok(cbId, out);
                } catch (e2) {
                    fail(cbId, e2.message);
                }
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };
})();
</script>
</body>
</html>
