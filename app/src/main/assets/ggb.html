<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GeoGebra Classic 5</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
    }
    #ggbApplet {
        width: 100%;
        height: 100%;
        display: block;
    }

    /*
     * Android phone layout fix.
     *
     * GeoGebra's mobile toolbar puts undo/redo/search/menu (rightButtonPanel)
     * and the drawing toolbar (toolBPanel) into the same 53px row. We remove
     * rightButtonPanel from the flow and pin it above the bottom-right zoom
     * panel, keeping only the original undo/redo arrow icons visible. The
     * drawing toolbar then gets the whole 53px row. The search/menu buttons
     * remain in the DOM (hidden) and are triggered from the native Android
     * top bar, so no functionality is lost.
     */
    .GeoGebraFrame .toolbarPanel .rightButtonPanel,
    .GeoGebraFrame .toolbarPanel .rightButtonPanelMobile {
        position: fixed !important;
        top: auto !important;
        left: auto !important;
        right: 16px !important;
        bottom: 220px; /* fallback; JS aligns it above the zoom panel */
        width: auto !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        z-index: 80;
    }

    /* Keep only the original undo/redo arrow buttons visible. */
    .GeoGebraFrame .toolbarPanel .rightButtonPanel > *:nth-child(n+3) {
        display: none !important;
    }

    .GeoGebraFrame .toolbarPanel .toolBPanel,
    .GeoGebraFrame .toolbarPanel .toolBPanelMobile {
        float: none !important;
        clear: both;
        width: 100% !important;
    }

    /*
     * Anti-mis-touch: the drawing canvas must not be subject to browser
     * touch scrolling/pinch gestures, so GeoGebra receives a clean
     * pointerdown -> pointermove -> pointerup stream for drawing tools.
     */
    .GeoGebraFrame canvas,
    .GeoGebraFrame .gwt-Canvas {
        touch-action: none;
    }

    /* Keep the search view title ("打开") on one horizontal line. */
    .GeoGebraFrame .headerView .headerCaption {
        white-space: nowrap !important;
        flex-shrink: 0;
    }
</style>
</head>
<body>
<div id="ggbApplet"></div>
<script src="deployggb.js"></script>
<script src="svg2tikz.js"></script>
<script>
(function () {
    "use strict";

    var appletId = "ggbApplet";
    var api = null;

    // ---------- query string helpers ----------
    var qs = {};
    (function () {
        var query = location.search || "";
        query.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) {
            qs[decodeURIComponent(k)] = decodeURIComponent(v);
            return _;
        });
    })();

    function qBool(name, def) {
        var v = qs[name];
        if (v === undefined || v === "") return def;
        return v === "true" || v === "1" || v === "yes";
    }

    function qNum(name, def) {
        var n = parseFloat(qs[name]);
        return isNaN(n) ? def : n;
    }

    function qStr(name, def) {
        var v = qs[name];
        return (v === undefined || v === "") ? def : v;
    }

    function notifyReady() {
        try { AndroidBridge.onAppletReady(); } catch (e) { /* bridge not ready yet */ }
    }

    function notifyError(msg) {
        try { AndroidBridge.onAppletError(msg || "unknown error"); } catch (e) { /* ignore */ }
    }

    function ggbOnLoad(loadedApi) {
        api = loadedApi;
        window.ggbApi = api;
        notifyReady();
    }
    window.ggbOnLoad = ggbOnLoad;

    // ---------- GeoGebra Classic 5 applet parameters ----------
    var params = {
        id: appletId,
        showMenuBar: qBool("showMenuBar", true),
        showToolBar: qBool("showToolBar", true),
        showAlgebraInput: qBool("showAlgebraInput", true),
        showToolBarHelp: qBool("showToolBarHelp", false),
        showResetIcon: qBool("showResetIcon", false),
        enableLabelDrags: qBool("enableLabelDrags", true),
        enableShiftDragZoom: qBool("enableShiftDragZoom", true),
        enableRightClick: qBool("enableRightClick", true),
        showZoomButtons: qBool("showZoomButtons", true),
        showFullscreenButton: qBool("showFullscreenButton", false),
        scale: qNum("scale", 1),
        disableAutoScale: qBool("disableAutoScale", false),
        clickToLoad: qBool("clickToLoad", false),
        language: qStr("language", "zh-CN"),
        prerelease: false,
        appName: "classic",
        allowUpscale: true,
        appletOnLoad: ggbOnLoad
    };

    // width/height: if provided use them, otherwise let deployggb size to the container.
    if (qs.width !== undefined && qs.width !== "") {
        params.width = Math.max(1, parseInt(qs.width, 10) || 0);
    }
    if (qs.height !== undefined && qs.height !== "") {
        params.height = Math.max(1, parseInt(qs.height, 10) || 0);
    }

    // Classic 5 views: algebra + graphics.
    var views = {
        is3D: 0,
        AV: 1,
        SV: 0,
        CV: 0,
        EV2: 0,
        CP: 0,
        PC: 0,
        DA: 0,
        FI: 0,
        macro: 0
    };

    var codebase = location.href.split("?")[0];
    codebase = codebase.slice(0, codebase.lastIndexOf("/") + 1) + "web3d/";

    try {
        var applet = new GGBApplet(params, "5.0", views);
        applet.setHTML5Codebase(codebase);
        applet.inject(appletId);
    } catch (e) {
        notifyError(e.message);
    }

    // ---------- position original undo/redo above the bottom-right zoom panel ----------
    function positionUndoRedoDock() {
        var rbp = document.querySelector(".rightButtonPanel");
        var zp = document.querySelector(".zoomPanel");
        if (!rbp || !zp) return;
        var rect = zp.getBoundingClientRect();
        var bottom = Math.max(8, window.innerHeight - rect.top + 8);
        rbp.style.bottom = bottom + "px";
        rbp.style.right = "16px";
    }

    function installUndoRedoDockPositioning() {
        var timer = null;

        function schedule() {
            if (timer) return;
            timer = setTimeout(function () {
                timer = null;
                positionUndoRedoDock();
            }, 100);
        }

        positionUndoRedoDock();
        window.addEventListener("resize", schedule);
        if (window.MutationObserver) {
            var mo = new MutationObserver(schedule);
            mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        } else {
            setInterval(positionUndoRedoDock, 1000);
        }
    }

    installUndoRedoDockPositioning();

    // ---------- anti-mis-touch: toolbar horizontal touch scrolling ----------
    // GeoGebra's mobile toolbar treats every touchend on a tool button as a
    // click (it compares toolbar.getAbsoluteLeft() with itself). We add a real
    // touch-drag threshold: a horizontal finger move scrolls toolBPanel and
    // suppresses the tool activation; taps without movement still work.
    function installToolbarTouchScroll() {
        var startX = null;
        var startY = null;
        var startScrollLeft = 0;
        var moved = false;
        var activePanel = null;
        var suppressClickUntil = 0;

        function panelFor(target) {
            if (!target || !target.closest) return null;
            return target.closest(".toolbarPanel .toolBPanel");
        }

        document.addEventListener("touchstart", function (e) {
            var panel = panelFor(e.target);
            if (!panel) {
                activePanel = null;
                return;
            }
            var t = e.touches && e.touches[0];
            if (!t) return;
            startX = t.clientX;
            startY = t.clientY;
            startScrollLeft = panel.scrollLeft;
            moved = false;
            activePanel = panel;
        }, { capture: true, passive: true });

        document.addEventListener("touchmove", function (e) {
            if (!activePanel) return;
            var t = e.touches && e.touches[0];
            if (!t) return;
            var dx = t.clientX - startX;
            var dy = t.clientY - startY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
                moved = true;
                activePanel.scrollLeft = startScrollLeft - dx;
                if (e.cancelable) e.preventDefault();
            } else if (Math.abs(dy) > 6) {
                moved = true; // vertical swipe on the toolbar: never a click
            }
        }, { capture: true, passive: false });

        document.addEventListener("touchend", function (e) {
            if (activePanel && moved) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                suppressClickUntil = Date.now() + 500;
            }
            activePanel = null;
            moved = false;
        }, { capture: true, passive: false });

        // Chrome fires a synthetic click after touchend; keep it away from the
        // toolbar buttons when the touch ended in a drag.
        document.addEventListener("click", function (e) {
            if (Date.now() < suppressClickUntil && panelFor(e.target)) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
        }, true);
    }

    installToolbarTouchScroll();

    // ---------- search field: use the system IME instead of GeoGebra's keyboard ----------
    document.addEventListener("focus", function (event) {
        var target = event.target;
        if (target && target.nodeType === 1 && target.closest
                && target.closest(".searchBar")) {
            // Stop GWT's own focus handler (which would open GeoGebra's
            // on-screen keyboard). The input element is still focused natively,
            // so Android shows the default IME.
            event.stopPropagation();
        }
    }, true);

    // ---------- keep the last executed search query, restore it when returning ----------
    var lastSearchQuery = "";

    function currentSearchInput() {
        return document.querySelector(".searchBar input[type=text]");
    }

    document.addEventListener("keypress", function (e) {
        if (e.key === "Enter" || e.keyCode === 13) {
            var target = e.target;
            if (target && target.closest && target.closest(".searchBar")) {
                lastSearchQuery = target.value || "";
            }
        }
    }, true);

    document.addEventListener("click", function (e) {
        var target = e.target;
        if (target && target.closest && target.closest(".materialCard")) {
            var input = currentSearchInput();
            if (input) {
                lastSearchQuery = input.value || lastSearchQuery;
            }
        }
    }, true);

    window.__ggbBack = function () {
        var openView = document.querySelector(".openFileView");
        if (openView) {
            var back = openView.querySelector(".headerBackButton");
            if (back) {
                back.click();
                return true;
            }
        }

        // Reopen search (e.g. when a searched material is currently open).
        var reopened = window.__ggbClickRightButton
                && window.__ggbClickRightButton("search");
        if (reopened && lastSearchQuery) {
            var attempts = 0;
            var timer = setInterval(function () {
                var input = currentSearchInput();
                if (input) {
                    clearInterval(timer);
                    input.value = lastSearchQuery;
                    try {
                        var ev = new KeyboardEvent("keypress", {
                            key: "Enter", code: "Enter", keyCode: 13,
                            which: 13, charCode: 13, bubbles: true
                        });
                        input.dispatchEvent(ev);
                    } catch (err) {
                        // best effort: the query is already filled in
                    }
                } else if (++attempts > 40) {
                    clearInterval(timer);
                }
            }, 100);
        }
        return reopened;
    };

    // ---------- helpers for Android ----------
    function b64ToUtf8(b64) {
        if (!b64) return "";
        if (b64.indexOf("data:") === 0 && b64.indexOf(",") >= 0) {
            b64 = b64.slice(b64.indexOf(",") + 1);
        }
        var binary = atob(b64);
        if (typeof TextDecoder === "undefined") {
            return decodeURIComponent(escape(binary));
        }
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder("utf-8").decode(bytes);
    }

    function ok(cbId, payload) {
        try { AndroidBridge.onResult(cbId, true, payload, null); } catch (e) { /* ignore */ }
    }

    function fail(cbId, message) {
        try { AndroidBridge.onResult(cbId, false, null, message || "unknown error"); } catch (e) { /* ignore */ }
    }

    function requireApi(cbId) {
        if (!api) {
            fail(cbId, "GeoGebra applet is not ready yet");
            return false;
        }
        return true;
    }

    window.__ggbIsReady = function () {
        return !!api;
    };

    window.__ggbGetSvg = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            // The exported Classic 5 API has exportSVG(callback) where the
            // callback receives the SVG source directly (there is no
            // getSVGBase64 in this build).
            api.exportSVG(function (svgText) {
                ok(cbId, svgText || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbGetPng = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            api.getScreenshotBase64(function (b64) {
                ok(cbId, b64 || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbGetGgb = function (cbId) {
        if (!requireApi(cbId)) return;
        try {
            api.getBase64(function (b64) {
                ok(cbId, b64 || "");
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    var ggbIncoming = {};

    window.__ggbSetGgbBegin = function (cbId) {
        ggbIncoming[cbId] = "";
    };

    window.__ggbSetGgbChunk = function (cbId, chunk) {
        if (typeof ggbIncoming[cbId] === "string") {
            ggbIncoming[cbId] += chunk;
        }
    };

    window.__ggbSetGgbEnd = function (cbId) {
        var b64 = ggbIncoming[cbId] || "";
        delete ggbIncoming[cbId];
        if (!requireApi(cbId)) return;
        try {
            api.setBase64(b64, function () {
                ok(cbId, null);
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };

    window.__ggbReset = function () {
        if (!api) return false;
        try {
            api.reset();
            return true;
        } catch (e) {
            return false;
        }
    };

    window.__ggbEvalCommand = function (cmd) {
        if (!api) return false;
        try {
            return api.evalCommand(cmd);
        } catch (e) {
            return false;
        }
    };

    window.__ggbUndo = function () {
        if (api && typeof api.undo === "function") {
            api.undo();
            return true;
        }
        return false;
    };

    window.__ggbRedo = function () {
        if (api && typeof api.redo === "function") {
            api.redo();
            return true;
        }
        return false;
    };

    // The native Android top bar owns undo/redo/search/menu. The GeoGebra
    // rightButtonPanel is moved off-screen by CSS, but its buttons are still
    // in the DOM and remain clickable programmatically.
    // Normal child order in rightButtonPanel: undo, redo, search, menu.
    window.__ggbClickRightButton = function (role) {
        var rbp = document.querySelector(".rightButtonPanel");
        if (!rbp) return false;
        var kids = rbp.children;
        var idx = -1;
        if (role === "menu") {
            idx = kids.length >= 4 ? 3 : kids.length >= 3 ? 2 : -1;
        } else if (role === "search") {
            idx = kids.length >= 4 ? 2 : -1;
        }
        if (idx >= 0 && kids[idx]) {
            kids[idx].click();
            return true;
        }
        return false;
    };

    window.__ggbGetTikz = function (cbId, settingsJson) {
        if (!requireApi(cbId)) return;
        try {
            var settings = JSON.parse(settingsJson);
            var mode = settings.outputMode || "codeblock";

            function figSettings() {
                var s = {};
                for (var k in settings) {
                    if (settings.hasOwnProperty(k)) s[k] = settings[k];
                }
                s.outputMode = "figonly";
                return s;
            }

            api.exportSVG(function (svgText) {
                try {
                    if (!svgText || svgText.indexOf("<svg") === -1) {
                        fail(cbId, "GeoGebra returned no SVG content. Draw something first.");
                        return;
                    }
                    var doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
                    var svg = doc.querySelector("svg");
                    if (!svg) {
                        fail(cbId, "Could not parse the SVG exported by GeoGebra.");
                        return;
                    }

                    var out;
                    if (mode === "codeblock") {
                        var c = new SvgToTikzConverter(figSettings()).convert(svg);
                        out = "~~~tikz\n\\begin{document}\n" + c + "\n\\end{document}\n\n~~~\n";
                    } else if (mode === "standalone") {
                        var st = figSettings();
                        st.outputMode = "standalone";
                        out = new SvgToTikzConverter(st).convert(svg);
                    } else if (mode === "figonly") {
                        out = new SvgToTikzConverter(figSettings()).convert(svg);
                    } else {
                        var co = figSettings();
                        co.outputMode = "codeonly";
                        out = new SvgToTikzConverter(co).convert(svg);
                    }
                    ok(cbId, out);
                } catch (e2) {
                    fail(cbId, e2.message);
                }
            });
        } catch (e) {
            fail(cbId, e.message);
        }
    };
})();
</script>
</body>
</html>
